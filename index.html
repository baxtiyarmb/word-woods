<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Woods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sky:#8FD3FF; --sky2:#D6F2FF; --cloud:#FFFFFF;
  --hill1:#8EDB7B; --hill2:#5CC16D;
  --line:#2B2A4C; --text-bg:#2B2A4C; --text-card:#2B2A4C; --muted-card:#6A6990;
  --card:#FFFFFF; --sun:#FFD54A; --coral:#FF8FA3; --mint:#7FE0B8; --grape:#8C73FF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#171B57; --sky2:#2B2F80; --cloud:#3A3F94;
    --hill1:#2F8F6A; --hill2:#20704F;
    --line:#0C0E33; --text-bg:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --sky:#171B57; --sky2:#2B2F80; --cloud:#3A3F94;
  --hill1:#2F8F6A; --hill2:#20704F;
  --line:#0C0E33; --text-bg:#FFFFFF;
}
:root[data-look="candy"]{--sky:#FFC4E4;--sky2:#E6D8FF;--cloud:#FFFFFF;--hill1:#CDB6FF;--hill2:#AE91F7;--line:#2B2A4C;--text-bg:#2B2A4C}
:root[data-look="sunset"]{--sky:#FFAF87;--sky2:#FFE9B5;--cloud:#FFF6E6;--hill1:#9AD66F;--hill2:#62B36A;--line:#2B2A4C;--text-bg:#2B2A4C}
:root[data-look="forest"]{--sky:#B9E9C6;--sky2:#EAFAD9;--cloud:#FFFFFF;--hill1:#43A56D;--hill2:#2E8454;--line:#2B2A4C;--text-bg:#2B2A4C}
:root[data-look="night"]{--sky:#171B57;--sky2:#2B2F80;--cloud:#3A3F94;--hill1:#2F8F6A;--hill2:#20704F;--line:#0C0E33;--text-bg:#FFFFFF}
:root[data-look="ocean"]{--sky:#7FE0F0;--sky2:#C9F3FF;--cloud:#FFFFFF;--hill1:#3FB6A8;--hill2:#2A9488;--line:#2B2A4C;--text-bg:#2B2A4C}
:root[data-look="space"]{--sky:#1B1038;--sky2:#4A2E8A;--cloud:#5B44A8;--hill1:#5B3FA0;--hill2:#3D2A78;--line:#0C0A24;--text-bg:#FFFFFF}
:root[data-look="rainbow"]{--sky:#FFD1E8;--sky2:#FFF1B8;--cloud:#FFFFFF;--hill1:#9AD66F;--hill2:#62B36A;--line:#2B2A4C;--text-bg:#2B2A4C}

html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;height:100%;
  font-family:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif;
  font-weight:500;color:var(--text-bg);
  background-color:var(--sky);
  background-image:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);
  background-attachment:fixed;
  -webkit-text-size-adjust:100%;
}
button,input{font-family:inherit}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:14px 16px 150px;min-height:100%}
.hills{position:fixed;left:0;bottom:0;width:100%;height:20vh;min-height:110px;z-index:0;pointer-events:none}
.cloud{position:fixed;z-index:0;pointer-events:none;opacity:.95}
.cloud svg{width:100%;height:auto;display:block}
.cloud.c1{top:10%;right:5%;width:130px}
.cloud.c2{top:34%;left:-20px;width:100px}

/* buttons & inputs */
.btn{
  font-weight:700;color:var(--text-card);background:var(--card);
  border:3px solid var(--line);border-radius:24px;
  box-shadow:0 6px 0 var(--line);padding:12px 18px;cursor:pointer;
  transition:transform .08s,box-shadow .08s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  font-size:20px;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.btn:focus-visible,.mcard:focus-visible,.inp:focus-visible,.pal button:focus-visible,.citem:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.btn.sel{background:var(--sun);outline:4px solid var(--grape);outline-offset:2px}
.ibtn{width:56px;height:56px;padding:0;border-radius:50%;font-size:26px;display:grid;place-items:center}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px}
.grp{display:flex;gap:10px}
.inp{
  width:100%;font-size:28px;font-weight:600;padding:14px 16px;
  border:3px solid var(--line);border-radius:22px;background:#fff;color:var(--text-card);
  box-shadow:0 5px 0 var(--line);
}
.inp::placeholder{color:#A2A1BE}

/* hero + home */
.hero{display:flex;align-items:flex-end;gap:10px;margin-top:4px}
.fox{font-size:84px;line-height:1;user-select:none}
.bubble{
  position:relative;background:var(--card);color:var(--text-card);
  border:3px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--line);
  padding:12px 16px;font-size:20px;font-weight:600;
}
.bubble::before{
  content:"";position:absolute;left:-13px;bottom:20px;width:20px;height:20px;
  background:var(--card);border-left:3px solid var(--line);border-bottom:3px solid var(--line);
  transform:rotate(45deg);border-radius:0 0 0 6px;
}
h1{
  margin:14px 0 2px;font-size:clamp(44px,13vw,64px);line-height:1;font-weight:700;
  color:var(--sun);-webkit-text-stroke:7px var(--line);paint-order:stroke fill;
  text-shadow:0 5px 0 var(--line);letter-spacing:.5px;
}
.sub{margin:8px 0 20px;font-size:18px;font-weight:600}
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.gt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 8px 14px;border-radius:26px;font-size:21px;line-height:1.1;text-align:center}
.gt .gp{font-size:42px;height:54px;display:flex;align-items:center;gap:4px;line-height:1}
.gt .gp b{font-size:38px}
.gt .gp svg{width:38px;height:38px}
.gt small{font-size:13px;font-weight:500;opacity:.78}
.gc0{background:var(--sun)}.gc1{background:var(--coral)}.gc2{background:var(--mint)}.gc3{background:#C2B5FF}.gc4{background:#9ADCFF}
.dot{display:inline-block;width:34px;height:34px;border-radius:50%;border:3px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row .btn{font-size:18px;padding:14px 10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row3 .btn{font-size:16px;padding:12px 6px}
.wide{display:block;width:100%;margin-top:14px;font-size:18px;padding:14px 10px}
.note{
  margin:26px 0 0;background:rgba(255,255,255,.88);color:var(--text-card);
  border-radius:18px;padding:12px 14px;font-size:15px;line-height:1.45;font-weight:500;
}

/* topics */
.title{margin:10px 0 4px;font-size:30px;font-weight:700}
.title small{display:block;font-size:16px;font-weight:500;opacity:.85}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.topic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:14px 8px;font-size:24px;border-radius:28px}
.topic .tp{font-size:48px;line-height:1.1;height:58px;display:flex;align-items:center;gap:4px}
.topic .tp b{font-size:38px}
.topic .tp svg{width:38px;height:38px}
.topic small{font-size:14px;font-weight:500;opacity:.75}
.t-animals{background:var(--sun)}
.t-colors{background:var(--coral)}
.t-fruits{background:var(--mint)}
.t-body{background:#C2B5FF}
.t-numbers{background:#9ADCFF}
.t-shapes{background:#FFC9A8}
.t-mix{background:#FFE9A8;grid-column:1/-1}

/* shared faces */
.sw{display:block;border-radius:50%;border:3px solid var(--line)}
.num{font-weight:700;line-height:1;color:var(--text-card)}
.shp{display:block;stroke:var(--line);stroke-width:4;stroke-linejoin:round}
.let{font-weight:700;line-height:1;color:var(--text-card)}
.ph{position:relative;display:grid;place-items:center;width:100%;height:100%}
.phc{position:absolute;width:72%;aspect-ratio:1/1;border-radius:50%;border:3px solid var(--line)}
.phe{position:relative;font-size:.62em;line-height:1}

/* play */
.stars{
  display:flex;gap:2px;font-size:28px;background:var(--card);
  border:3px solid var(--line);border-radius:999px;padding:4px 12px;box-shadow:0 4px 0 var(--line);
}
.star{filter:grayscale(1) opacity(.3);transition:filter .2s}
.star.on{filter:none;animation:pop .5s}
.ask{display:flex;align-items:flex-end;gap:12px;margin:18px 0 24px}
.ask .fox{font-size:76px}
.ask .fox.hop{animation:hop .6s}
.ask .bubble{flex:1;display:flex;align-items:center;gap:14px;padding:14px 16px}
.say{
  width:64px;height:64px;flex:none;border-radius:50%;padding:0;font-size:30px;
  background:var(--sun);display:grid;place-items:center;
}
.word{font-size:clamp(34px,10vw,50px);font-weight:700;line-height:1}
.word.sm{font-size:clamp(22px,6.4vw,30px);line-height:1.1}
.az{font-size:16px;color:var(--muted-card);font-weight:500;margin-top:4px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.choices.four{grid-template-columns:repeat(2,1fr);max-width:440px;margin:0 auto}
.choice{
  aspect-ratio:1/1;display:grid;place-items:center;padding:0;position:relative;
  border-radius:30px;font-size:clamp(52px,17vw,96px);line-height:1;
}
.choice .sw{width:68%;height:68%}
.choice .shp{width:70%;height:70%}
.choice .let{font-size:clamp(44px,15vw,78px)}
.choice.numc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.choice .num{font-size:clamp(46px,15vw,80px)}
.choice .dots{font-size:9px;letter-spacing:1px;line-height:1.15;max-width:80%;text-align:center;opacity:.6;font-weight:500}
.choice.shake{animation:shake .45s}
.choice.off{opacity:.35;pointer-events:none;box-shadow:0 2px 0 var(--line);transform:translateY(4px)}
.choice.right{background:#C2F7D4;animation:pop .5s;pointer-events:none}
.choice.right::after{
  content:"✓";position:absolute;top:-10px;right:-10px;width:38px;height:38px;border-radius:50%;
  background:#2FBF71;color:#fff;font-size:22px;display:grid;place-items:center;border:3px solid var(--line);
}
.choice.hint{animation:wiggle .9s infinite}
.stagebox{
  display:flex;flex-wrap:wrap;justify-content:center;gap:6px;background:rgba(255,255,255,.65);
  border:3px solid var(--line);border-radius:26px;padding:12px;margin-bottom:18px;min-height:90px;
}
.citem{font-size:44px;line-height:1;padding:4px;background:none;border:0;cursor:pointer;border-radius:14px;transition:transform .15s,opacity .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.citem.counted{opacity:.4;transform:scale(.82)}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.mcard{
  display:block;position:relative;aspect-ratio:3/4;cursor:pointer;perspective:700px;
  border-radius:20px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.mcard .inner{display:block;position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .4s}
.mcard.flip .inner{transform:rotateY(180deg)}
.mface{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:grid;place-items:center;border:3px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);
}
.mfront{
  background:repeating-linear-gradient(45deg,var(--grape) 0 10px,#A992FF 10px 20px);
  color:#fff;font-size:40px;font-weight:700;
}
.mback{background:var(--card);transform:rotateY(180deg);font-size:clamp(34px,10vw,56px);line-height:1}
.mback .sw{width:62%;aspect-ratio:1/1;height:auto}
.mback .shp{width:66%;height:auto}
.mback .num{font-size:clamp(36px,11vw,56px)}
.mcard.done .mback{background:#C2F7D4}
.mcard.done{pointer-events:none}

/* shape puzzle */
.pz-holes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.hole{
  aspect-ratio:1/1.25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:3px dashed var(--line);border-radius:22px;background:rgba(255,255,255,.6);padding:6px 2px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.hole .shp{width:78%;height:auto;stroke-dasharray:7 6}
.hole .hl{display:flex;flex-direction:column;align-items:center;min-height:32px;text-align:center;color:var(--text-card);line-height:1.15}
.hole .hl b{font-size:14px;font-weight:700}
.hole .hl i{font-style:normal;font-size:11px;font-weight:500;color:var(--muted-card)}
.hole.filled{border-style:solid;background:#C2F7D4;cursor:default;animation:pop .5s}
.hole.filled .shp{stroke-dasharray:none}
.hole.hint{animation:wiggle .9s infinite;border-color:var(--grape)}
.hole:focus-visible,.piece:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.tray{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:28px;padding:12px 8px;
  background:rgba(255,255,255,.5);border:3px solid var(--line);border-radius:26px;
}
.piece{
  position:relative;aspect-ratio:1/1;display:grid;place-items:center;border-radius:20px;cursor:grab;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;transition:transform .15s;
}
.piece .shp{width:86%;height:86%;pointer-events:none}
.piece.sel{background:rgba(255,255,255,.9);outline:4px solid var(--grape);outline-offset:-2px}
.piece.drag{z-index:30;transition:none;cursor:grabbing;filter:drop-shadow(0 8px 6px rgba(0,0,0,.28))}
.piece.used{visibility:hidden;pointer-events:none}
.piece.shake{animation:shake .45s}

/* simon says */
.scard{
  display:grid;place-items:center;gap:4px;background:var(--card);color:var(--text-card);
  border:3px solid var(--line);border-radius:30px;box-shadow:0 6px 0 var(--line);padding:18px 12px;text-align:center;
}
.scard .se{font-size:96px;line-height:1}
.scard .st{font-size:20px;font-weight:600;color:var(--muted-card)}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 8px;font-size:19px;border-radius:26px;line-height:1.15}
.sbtn b{font-size:40px;line-height:1}
.sbtn small{font-size:13px;font-weight:500;opacity:.8}
.sgo{background:#B8F2C9}
.sstop{background:#FFC2C2}
.sbtn.hint{animation:wiggle .9s infinite}

/* coloring */
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.thumbs .btn{font-size:30px;padding:8px 0;border-radius:20px}
.canvas{background:var(--card);border:3px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--line);padding:8px;margin:16px auto 0;max-width:440px}
.canvas svg{display:block;width:100%;height:auto}
.reg{fill:#fff;stroke:var(--line);stroke-width:4;stroke-linejoin:round;cursor:pointer}
.fix{fill:var(--line);stroke:var(--line);stroke-width:3}
.line{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round}
.pal{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
.pal button{width:48px;height:48px;border-radius:50%;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);cursor:pointer;padding:0;font-size:22px;display:grid;place-items:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pal button.sel{outline:4px solid var(--grape);outline-offset:2px}

/* reward */
.reward{text-align:center;padding-top:10px}
.reward h2{margin:0;font-size:clamp(38px,11vw,54px);color:var(--sun);-webkit-text-stroke:6px var(--line);paint-order:stroke fill;text-shadow:0 4px 0 var(--line)}
.stage{position:relative;width:260px;height:260px;margin:18px auto 8px;display:grid;place-items:center}
.rays{
  position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.7) 0 10deg,transparent 10deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 35%,transparent 72%);mask-image:radial-gradient(circle,#000 35%,transparent 72%);
  animation:spin 14s linear infinite;
}
.badge{
  position:relative;width:170px;height:170px;border-radius:50%;background:var(--card);
  border:5px solid var(--line);box-shadow:0 8px 0 var(--line);display:grid;place-items:center;
  font-size:104px;line-height:1;transform:rotate(-7deg);animation:slam .7s cubic-bezier(.2,1.4,.4,1);
}
.reward .big{font-size:30px;font-weight:700;margin:0}
.reward .rsub{font-size:18px;margin:2px 0 14px;font-weight:600}
.actions{display:grid;gap:14px}
.actions .primary{background:var(--sun);font-size:26px;padding:16px}

/* tiles, book, learn */
.hd{margin:20px 0 10px;font-size:24px;font-weight:700}
.hd small{font-size:15px;font-weight:500;opacity:.85;margin-left:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 6px;border-radius:24px}
.tile .pic{font-size:clamp(44px,12vw,64px);line-height:1.1;display:grid;place-items:center;height:68px}
.tile .pic .sw{width:56px;height:56px}
.tile .pic .shp{width:56px;height:56px}
.tile .pic .num{font-size:46px}
.tile .tw{font-size:20px;font-weight:700}
.tile .taz{font-size:14px;font-weight:500;color:var(--muted-card);line-height:1.2}
.tile.has::after{
  content:"✓";position:absolute;top:6px;right:8px;color:#fff;background:#2FBF71;width:24px;height:24px;
  border-radius:50%;font-size:14px;display:grid;place-items:center;border:2px solid var(--line);
}
.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (min-width:500px){.grid4{grid-template-columns:repeat(4,1fr)}}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 4px;border-radius:24px;aspect-ratio:1/1.05}
.slot .pic{font-size:clamp(44px,12vw,60px);line-height:1.1}
.slot.locked{background:rgba(255,255,255,.55);border-style:dashed;box-shadow:none;cursor:default}
.slot.locked .pic{filter:brightness(0) opacity(.18)}
.slot .tw{font-size:17px;font-weight:700}
.total{font-size:18px;font-weight:600;margin:0 0 6px}

/* my look */
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cbtn{font-size:52px;line-height:1;padding:12px 0;border-radius:26px}
.looks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lk{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:14px 16px;font-size:20px;border-radius:24px;text-align:left}
.lk small{font-size:14px;font-weight:500;opacity:.85}

/* my woods */
.scene{
  position:relative;aspect-ratio:4/3;border:3px solid var(--line);border-radius:28px;box-shadow:0 6px 0 var(--line);
  overflow:hidden;margin-top:12px;background:linear-gradient(180deg,var(--sky) 0 58%,var(--hill1) 58% 100%);
}
.si{position:absolute;transform:translate(-50%,-50%);line-height:1;user-select:none}
.pet{background:none;border:0;padding:0;cursor:pointer;animation:bob 2.6s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.prog{height:20px;border:3px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:var(--sun)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--text-card);border:3px solid var(--line);border-radius:18px;padding:6px 12px;font-size:16px;font-weight:600}
.chip.lock{filter:grayscale(1);opacity:.55}
.chip small{font-size:12px;font-weight:500;color:var(--muted-card)}
.chip .sw{width:28px;height:28px}
.chip .shp{width:32px;height:32px}
.chip .num{font-size:26px}
.chip .let{font-size:24px}
.chip .ce{font-size:28px;line-height:1}

/* parent area */
.pcard{background:var(--card);color:var(--text-card);border:3px solid var(--line);border-radius:22px;padding:14px 16px;margin-top:14px;box-shadow:0 5px 0 var(--line)}
.pcard h3{margin:0 0 8px;font-size:20px}
.pcard p{margin:4px 0;font-size:16px;line-height:1.4;font-weight:500}
.pcard .chip{box-shadow:none}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%}
.bars i{display:block;width:100%;background:var(--grape);border-radius:8px 8px 0 0;min-height:3px}
.bars .t i{background:var(--coral)}
.bars span{font-size:12px;font-weight:600;color:var(--muted-card)}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.opts .btn{font-size:16px;padding:8px 14px;border-radius:18px}
.gq{font-size:44px;font-weight:700;text-align:center;margin:22px 0 10px}
.err{color:#C03030;font-weight:600;min-height:24px;text-align:center}
.sleep{text-align:center;padding-top:30px}
.sleep .fox{font-size:110px}
.sleep h2{font-size:34px;margin:10px 0 4px}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);color:var(--text-card);
  border:3px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;text-align:center;
  box-shadow:0 -6px 0 rgba(0,0,0,.12);
}
.sheet .big{font-size:56px;line-height:1;display:grid;place-items:center;height:64px}
.sheet .big .shp{width:56px;height:56px}
.sheet .big .sw{width:50px;height:50px}
.sheet .big .num,.sheet .big .let{font-size:52px}
.sheet .w{font-size:28px;font-weight:700}
.sheet p{margin:4px 0 12px;font-size:16px;min-height:22px}
.sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .grid2 .btn{font-size:17px;padding:12px 8px}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  opacity:0;pointer-events:none;background:var(--line);color:#fff;padding:10px 18px;border-radius:999px;
  font-weight:600;z-index:70;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%)}

/* compact home tiles */
.gtiles{gap:10px}
.gt{flex-direction:row;justify-content:flex-start;gap:10px;padding:10px 12px;font-size:16px;text-align:left}
.gt .gp{font-size:30px;height:auto;min-width:40px;justify-content:center}
.gt .gp b{font-size:28px}
.gt .gp svg{width:28px;height:28px}
.gtt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.gt small{font-size:12px}
.adv{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;margin-bottom:16px;font-size:22px;background:linear-gradient(135deg,var(--sun),#FFB86B)}
.advi{font-size:40px;line-height:1}
.advt small{display:block;font-size:14px;font-weight:500;opacity:.85}
.wide.primary{background:var(--sun);font-size:24px;padding:16px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.lockd,.lk.lockd{opacity:.55}

/* dress-up avatar */
.av{position:relative;display:inline-block;line-height:1}
.av i{position:absolute;font-style:normal;line-height:1;pointer-events:none}
.o-hat{left:50%;top:-24%;transform:translateX(-50%);font-size:.56em}
.o-face{left:50%;top:34%;transform:translateX(-50%);font-size:.5em}
.o-neck{left:50%;top:74%;transform:translateX(-50%);font-size:.42em}
.o-side{left:78%;top:30%;font-size:.5em}
.dstage{display:grid;place-items:center;padding:40px 0 16px;background:rgba(255,255,255,.55);border:3px solid var(--line);border-radius:28px;margin-top:8px}
.dt .tw{font-size:14px}

/* run the road */
.doors{animation:approach .5s ease-out}
.door{aspect-ratio:3/4;border-radius:44px 44px 14px 14px;background:#E9BE8E}
.door .sw{width:60%;height:auto;aspect-ratio:1/1}
.door .shp{width:62%;height:auto}
.door .num{font-size:clamp(40px,13vw,70px)}
.lane{height:34px;margin-top:22px;border:3px solid var(--line);border-radius:18px;background:repeating-linear-gradient(90deg,#6D6C93 0 40px,#8D8CB3 40px 80px);background-size:160px 100%}
.lane.go{animation:lane .9s linear}
@keyframes lane{to{background-position:-160px 0}}
@keyframes approach{from{transform:translateY(-36px) scale(.78);opacity:0}}

/* feed the pet */
.feed .ask .fox{font-size:112px}
.choice.fly{pointer-events:none;z-index:20;transition:transform .55s ease-in,opacity .55s}

/* mini story */
.sart{font-size:84px;text-align:center;margin:10px 0;line-height:1.1}
.stxt{display:flex;align-items:center;gap:14px;background:var(--card);color:var(--text-card);border:3px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--line);padding:14px 16px;margin-bottom:18px}
.stxt p{margin:0;font-size:24px;font-weight:600;line-height:1.35}
.kw{color:#5B3FD6;border-bottom:3px dotted #5B3FD6;cursor:pointer}
.sqt{font-size:22px;font-weight:700;text-align:center;margin:6px 0 12px}

/* tracing */
.tbox{position:relative;width:100%;max-width:340px;aspect-ratio:1/1;margin:14px auto 0;background:var(--card);border:3px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--line);overflow:hidden}
.tbox canvas{position:absolute;inset:0;width:100%;height:100%}
#tcv{touch-action:none;cursor:crosshair}

/* hidden objects */
.hscene{position:relative;aspect-ratio:4/3;border:3px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--line);overflow:hidden}
.obj{position:absolute;transform:translate(-50%,-50%);font-size:clamp(32px,9.5vw,52px);line-height:1;background:none;border:0;padding:4px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.obj.found{background:rgba(194,247,212,.92);border-radius:50%;outline:3px solid #2FBF71;pointer-events:none}
.obj.shake{animation:shakeo .45s}
.obj.hint{animation:wigo .9s infinite}
@keyframes shakeo{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(-64%,-50%)}75%{transform:translate(-36%,-50%)}}
@keyframes wigo{0%,100%{transform:translate(-50%,-50%) rotate(0)}25%{transform:translate(-50%,-50%) rotate(-9deg)}75%{transform:translate(-50%,-50%) rotate(9deg)}}

/* adventure map + break */
.amap{display:grid;gap:10px;margin:14px 0}
.stop{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.7);border:3px solid var(--line);border-radius:22px;padding:10px 14px;color:var(--text-card);font-size:20px;font-weight:700;opacity:.78}
.stop .sic{font-size:34px;width:44px;text-align:center;line-height:1}
.stop small{display:block;font-size:13px;font-weight:500;color:var(--muted-card)}
.stop.now{opacity:1;background:var(--sun);box-shadow:0 5px 0 var(--line)}
.stop.done{opacity:1;background:#C2F7D4}
.brk{text-align:center;padding-top:20px}
.brk h2{font-size:38px;margin:0}
.bigemoji{font-size:110px;line-height:1.1;margin:10px 0}
.cnt{margin:16px auto;width:84px;height:84px;border-radius:50%;background:var(--card);color:var(--text-card);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);display:grid;place-items:center;font-size:36px;font-weight:700}

/* balloon pop + catch it */
.bscene,.cscene{position:relative;height:clamp(340px,60vh,540px);border:3px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--line);overflow:hidden;margin-top:8px;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.12))}
.cscene{touch-action:none}
.bw{position:absolute;bottom:-130px;animation:rise var(--d,8s) linear forwards}
.balloon{position:relative;display:block;width:84px;height:104px;border:3px solid var(--line);border-radius:50% 50% 46% 46%;padding:0;cursor:pointer;animation:sway 2.2s ease-in-out infinite alternate;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:inset -8px -8px 0 rgba(0,0,0,.14)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:34px;background:var(--line);transform:translateX(-50%)}
.bface{display:grid;place-items:center;width:58px;height:58px;margin:12px auto 0;background:#fff;border-radius:50%;font-size:34px;line-height:1;color:#2B2A4C}
.bface .sw{width:34px;height:34px}
.bface .shp{width:38px;height:38px}
.bface .num{font-size:30px}
.balloon.pop{animation:burst .28s ease-out forwards;pointer-events:none}
.balloon.wob{animation:shake .45s}
.balloon.glow{outline:4px solid var(--sun);outline-offset:3px}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(calc(-1 * var(--h,420px) - 220px))}}
@keyframes sway{from{transform:translateX(-10px) rotate(-4deg)}to{transform:translateX(10px) rotate(4deg)}}
@keyframes burst{to{transform:scale(1.7);opacity:0}}
.basket{position:absolute;bottom:1%;font-size:60px;line-height:1;transform:translateX(-50%);transition:left .08s linear;user-select:none}
.basket.shk{animation:bshake .4s}
.fall{position:absolute;transform:translate(-50%,-50%);font-size:44px;line-height:1;pointer-events:none}
.fall .sw{width:38px;height:38px}
.fall .shp{width:44px;height:44px}
.fall .num{font-size:40px}
.fall.got{animation:gotit .25s forwards}
@keyframes gotit{to{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
@keyframes bshake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(-62%)}75%{transform:translateX(-38%)}}

/* confetti */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.cf{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;border:2px solid var(--line);animation:fall linear forwards}

@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-26px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slam{0%{transform:scale(.2) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(-7deg);opacity:1}}
@keyframes bob{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-58%)}}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

var reduce=false;

var ac=null;
function tone(freq,start,dur,type,vol){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+start;
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function sfx(kind){
  if(muted)return;
  if(kind==='right'){tone(523,0,.18);tone(659,.12,.18);tone(784,.24,.3)}
  else if(kind==='wrong'){tone(240,0,.2,'triangle',.14);tone(190,.14,.28,'triangle',.14)}
  else if(kind==='win'){[523,659,784,1047,1319].forEach(function(f,i){tone(f,i*.13,.3,'sine',.18)})}
  else if(kind==='pop'){tone(700,0,.07,'sine',.1)}
}

var synth=window.speechSynthesis||null;
var voice=null;
function pickVoice(){
  if(!synth)return;
  var vs=synth.getVoices().filter(function(v){return /^en/i.test(v.lang)});
  voice=vs.filter(function(v){return /(samantha|google us english|aria|jenny|zira|female)/i.test(v.name)})[0]
    ||vs.filter(function(v){return /en[-_]US/i.test(v.lang)})[0]||vs[0]||null;
}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}

/* recorded clips live in IndexedDB; clips[key] = object URL */
var clips={};
var idb=null;
function openDB(cb){
  try{
    var r=indexedDB.open('ww_voice',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('clips')};
    r.onsuccess=function(){idb=r.result;cb&&cb()};
    r.onerror=function(){cb&&cb()};
  }catch(e){cb&&cb()}
}
function loadClips(){
  openDB(function(){
    if(!idb)return;
    try{
      var req=idb.transaction('clips','readonly').objectStore('clips').openCursor();
      req.onsuccess=function(){
        var c=req.result;
        if(c){clips[c.key]=URL.createObjectURL(c.value);c.continue()}
      };
    }catch(e){}
  });
}
function saveClip(key,blob,cb){
  if(!idb){cb&&cb(false);return}
  try{
    var tx=idb.transaction('clips','readwrite');
    tx.objectStore('clips').put(blob,key);
    tx.oncomplete=function(){
      if(clips[key])URL.revokeObjectURL(clips[key]);
      clips[key]=URL.createObjectURL(blob);cb&&cb(true);
    };
    tx.onerror=function(){cb&&cb(false)};
  }catch(e){cb&&cb(false)}
}
function deleteClip(key,cb){
  if(!idb){cb&&cb();return}
  try{
    var tx=idb.transaction('clips','readwrite');
    tx.objectStore('clips').delete(key);
    tx.oncomplete=function(){
      if(clips[key]){URL.revokeObjectURL(clips[key]);delete clips[key]}
      cb&&cb();
    };
    tx.onerror=function(){cb&&cb()};
  }catch(e){cb&&cb()}
}
loadClips();

var seq=0,curAudio=null;
function stopSpeech(){
  seq++;
  try{synth&&synth.cancel()}catch(e){}
  if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}
}
function speakTTS(text,rate,done,delay){
  if(!synth){done&&done();return}
  setTimeout(function(){
    try{
      var u=new SpeechSynthesisUtterance(text),fin=false;
      u.lang='en-US';if(voice)u.voice=voice;
      u.rate=rate||0.8;u.pitch=1.15;
      var end=function(){if(!fin){fin=true;done&&done()}};
      u.onend=end;u.onerror=end;
      synth.speak(u);
      if(done)setTimeout(end,Math.max(1800,text.length*140));
    }catch(e){done&&done()}
  },delay||0);
}
function playClip(key,done){
  try{
    var a=new Audio(clips[key]);
    curAudio=a;
    a.onended=function(){done&&done()};
    a.onerror=function(){done&&done()};
    var p=a.play();
    if(p&&p.catch)p.catch(function(){done&&done()});
  }catch(e){done&&done()}
}
/* parts: strings (spoken by the device voice) and {clip:key} (your recording) */
function sayParts(parts,rate){
  if(muted)return;
  stopSpeech();
  var my=seq,list=[];
  parts.forEach(function(p){
    if(typeof p==='string'){
      if(list.length&&typeof list[list.length-1]==='string')list[list.length-1]+=' '+p;else list.push(p);
    }else list.push(p);
  });
  (function step(i){
    if(my!==seq||i>=list.length)return;
    var p=list[i];
    if(typeof p==='string')speakTTS(p,rate,function(){step(i+1)},i===0?60:0);
    else playClip(p.clip,function(){step(i+1)});
  })(0);
}
function say(text,rate){sayParts([text],rate)}
function W(en){var k=String(en).toLowerCase();return clips[k]?{clip:k}:en}
function clipKey(t){return TOPIC_ORDER.indexOf(t.kind)>-1?t.en.toLowerCase():null}
function sayItem(it,rate){sayParts([W(it.en)],rate||0.75)}
function praise(){
  var p=rnd(PRAISE);
  if(name&&Math.random()<0.35)p=p.replace('!',', '+name+'!');
  return p;
}
function praiseParts(t){
  var p=praise(),k=clipKey(t);
  if(k&&clips[k])return [{clip:k},p];
  return [t.en+'! '+p];
}
function askText(t){return TOPICS[t.kind].ask(t.en)}
function withClip(s,t){
  var k=clipKey(t);
  if(!k||!clips[k])return [s];
  var i=s.lastIndexOf(t.en);
  if(i<0)return [s];
  var pre=s.slice(0,i).trim(),post=s.slice(i+t.en.length).trim(),out=[];
  if(pre)out.push(pre);
  out.push({clip:k});
  if(post&&post!=='?')out.push(post);
  return out;
}
function sayQ(q){
  if(q.say){var sp=typeof q.say==='function'?q.say():q.say;sayParts(Array.isArray(sp)?sp:[sp]);return}
  sayParts(withClip(askText(q.target),q.target));
}

/* microphone recording */
var recState={active:false,rec:null,timer:null};
function startRec(key,onState){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){onState('unsupported');return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mr=new MediaRecorder(stream),chunks=[];
    recState={active:true,rec:mr,timer:null};
    mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop()});
      clearTimeout(recState.timer);recState.active=false;
      var blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
      if(blob.size<800){onState('empty');return}
      saveClip(key,blob,function(ok){onState(ok?'saved':'error')});
    };
    mr.start();onState('recording');
    recState.timer=setTimeout(stopRec,3500);
  }).catch(function(){onState('denied')});
}
function stopRec(){
  if(recState.rec&&recState.active&&recState.rec.state!=='inactive'){try{recState.rec.stop()}catch(e){}}
}

function isGood(r){return r.ok>=3&&r.bad/(r.ok+r.bad)<=0.2}
function chipRow(r){

}

      if(!seen[k]){seen[k]=1;items.push({key:k,it:it,label:it.en})}

/* =====================================================
   round builders
   ===================================================== */
function buildRound(topic){
  var targets;
  if(topic==='mix')targets=shuffle(TOPIC_ORDER).slice(0,5).map(function(t){return pickTargets(TOPICS[t].items,1)[0]});
  else targets=pickTargets(TOPICS[topic].items,5);
  return targets.map(function(t){
    var pool=TOPICS[t.kind].items;
    var others=shuffle(pool.filter(function(p){return p.id!==t.id})).slice(0,2);
    return {target:t,choices:shuffle([t].concat(others))};
  });
}
function buildCountRound(){
  var max=Math.min(10,4+countLvl),range=[];
  for(var i=1;i<=max;i++)range.push(i);
  return shuffle(range).slice(0,5).map(function(n){
    var thing=rnd(THINGS),t=NUMBERS[n-1];
    var others=shuffle(range.filter(function(x){return x!==n})).slice(0,2).map(function(x){return NUMBERS[x-1]});
    var vis='';
    for(var k=0;k<n;k++)vis+='<button class="citem" data-action="citem" aria-label="'+thing.pl+'">'+thing.e+'</button>';
    return {target:t,choices:shuffle([t].concat(others)),thing:thing,visual:vis,
      say:'How many '+thing.pl+'?',bubWord:'How many?',bubAz:'Neçə dənədir?',small:true,
      explain:function(){return [t.en+' '+thing.pl+'! '+praise()]}};
  });
}
function buildOddRound(){
  var order=shuffle(TOPIC_ORDER),qs=[];
  for(var i=0;i<5;i++){
    var A=order[i%order.length],B=rnd(TOPIC_ORDER.filter(function(x){return x!==A}));
    var three=shuffle(TOPICS[A].items).slice(0,3),odd=pickTargets(TOPICS[B].items,1)[0];
    qs.push((function(A,B,three,odd){
      return {target:odd,choices:shuffle(three.concat([odd])),say:'Which one is different?',
        bubWord:'Which is different?',bubAz:'Hansı fərqlidir?',small:true,
        explain:function(){return ['Yes! '+odd.en+' is '+art(SINGLE[B])+'. The others are '+PLURAL[A]+'.']}};
    })(A,B,three,odd));
  }
  return qs;
}
function mkPhrase(noun,adj){
  if(adj.kind==='colors'){
    return {kind:'phrase',id:'c-'+adj.id+'-'+noun.id,en:adj.en+' '+noun.en,az:adj.az+' '+noun.az,noun:noun,adj:adj,sk:noun.id};
  }
  var w=adj.big?'big':'small';
  return {kind:'phrase',id:'s-'+w+'-'+noun.id,en:w+' '+noun.en,az:(adj.big?'böyük ':'kiçik ')+noun.az,noun:noun,big:adj.big,size:true,sk:noun.id};
}
function buildPhraseRound(){
  var nouns=ANIMALS.concat(FRUITS),qs=[];
  for(var i=0;i<5;i++){
    var noun=rnd(nouns),other=rnd(nouns.filter(function(n){return n.id!==noun.id})),target,choices;
    if(i%2===0){
      var adj=rnd(COLORS),adj2=rnd(COLORS.filter(function(c){return c.id!==adj.id}));
      target=mkPhrase(noun,adj);
      choices=[target,mkPhrase(other,adj),mkPhrase(noun,adj2)];
    }else{
      var big=Math.random()<0.5;
      target=mkPhrase(noun,{big:big});
      choices=[target,mkPhrase(noun,{big:!big}),mkPhrase(other,{big:big})];
    }
    qs.push({target:target,choices:shuffle(choices)});
  }
  return qs;
}
function buildAbcRound(){
  return shuffle(LETTERS).slice(0,5).map(function(t,i){
    var others=shuffle(LETTERS.filter(function(l){return l.id!==t.id})).slice(0,2);
    var choices=shuffle([t].concat(others));
    if(i%2===0||t.noPic){
      return {target:t,choices:choices,say:'Where is the letter '+t.l+'?',
        bubWord:t.l+t.l.toLowerCase(),bubAz:'hərf '+t.l,
        explain:function(){return ['Yes! '+t.l+' is for',W(t.word)]}};
    }
    return {target:t,choices:choices,
      say:function(){return ['Which letter does',W(t.word),'start with?']},
      bubWord:t.e,bubAz:t.word+' / '+t.waz,
      explain:function(){return ['Yes!',W(t.word),'starts with '+t.l+'.']}};
  });
}

/* =====================================================
   game flow
   ===================================================== */
function buildRunRound(){
  return buildRound('mix').map(function(q){
    var t=q.target;
    q.say=function(){return ['Run to the',W(t.en),'door!']};
    return q;
  });
}
function buildFeedRound(){
  return pickTargets(FRUITS,5).map(function(t){
    var others=shuffle(FRUITS.filter(function(p){return p.id!==t.id})).slice(0,2);
    var a=art(t.en).split(' ')[0];
    return {target:t,choices:shuffle([t].concat(others)),
      say:function(){return ['I am hungry! I want '+a,W(t.en)]},
      bubWord:'I want '+art(t.en),bubAz:t.az,small:true,
      explain:function(){return [W(t.en),'Yum yum! Thank you!']}};
  });
}
function startRound(game,topic,adv){
  if(overLimit()){go('sleep');return}
  if(sessionDue()){go('break');return}
  if(!adv)state.adv=null;
  rid++;
  state.game=game;state.topic=topic;state.stars=0;state.wrong=0;state.locked=false;state.startStars=totalStars;
  if(game==='memory'){startMemory(topic);return}
  if(game==='puzzle'){startPuzzle();return}
  if(game==='simon'){startSimon();return}
  if(game==='coloring'){startColoring();return}
  if(game==='trace'){startTrace();return}
  if(game==='hunt'){startHunt();return}
  if(game==='story'){startStory();return}
  if(game==='balloon'){startBalloon();return}
  if(game==='catch'){startCatch();return}
  if(game==='count')state.qs=buildCountRound();
  else if(game==='odd')state.qs=buildOddRound();
  else if(game==='phrase')state.qs=buildPhraseRound();
  else if(game==='abc')state.qs=buildAbcRound();
  else if(game==='run')state.qs=buildRunRound();
  else if(game==='feed')state.qs=buildFeedRound();
  else state.qs=buildRound(topic);
  state.i=0;state.total=state.qs.length;state.cnt=0;
  go('play');
  var my=rid;
  setTimeout(function(){if(my===rid)sayQ(state.qs[0])},400);
}

function confetti(n){
  if(reduce)return;
  var box=document.getElementById('fx');
  var cols=['#FFD54A','#FF8FA3','#7FE0B8','#9B84FF','#5BB8FF','#FF9F43'];
  for(var i=0;i<n;i++){
    var s=document.createElement('span');
    s.className='cf';
    s.style.left=(Math.random()*100)+'vw';
    s.style.background=cols[i%cols.length];
    s.style.animationDelay=(Math.random()*.4)+'s';
    s.style.animationDuration=(1.6+Math.random()*1.2)+'s';
    s.style.setProperty('--dx',(Math.random()*160-80)+'px');
    s.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    box.appendChild(s);
    (function(el){setTimeout(function(){el.remove()},3400)})(s);
  }
}
function addStar(){
  totalStars++;store.set('ww_stars',totalStars);
  var stars=app.querySelectorAll('.star');
  if(stars[state.stars-1])stars[state.stars-1].classList.add('on');
}
function hopFox(){
  var fox=document.getElementById('fox');
  if(fox){fox.classList.remove('hop');void fox.offsetWidth;fox.classList.add('hop')}
}

/* --- quiz-type games (find, listen, count, odd, phrase, abc) --- */
function pick(idx){
  if(state.locked)return;
  var q=state.qs[state.i],c=q.choices[idx];
  var el=app.querySelectorAll('.choice')[idx];
  if(!el)return;
  if(c.id===q.target.id)onCorrect(el,q);
  else onWrong(el,c,q);
}
function onWrong(el,c,q){
  state.wrong++;
  if(state.wrong===1)rec(statKey(q.target),false);
  el.classList.add('shake');
  setTimeout(function(){el.classList.remove('shake');el.classList.add('off')},450);
  sfx('wrong');
  say('Oops, that is '+TOPICS[c.kind].named(c.en)+'. Try again!');
  if(state.wrong>=2){
    var idx=q.choices.map(function(x){return x.id}).indexOf(q.target.id);
    var right=app.querySelectorAll('.choice')[idx];
    if(right)right.classList.add('hint');
  }
}
function onCorrect(el,q){
  state.locked=true;state.stars++;
  if(state.wrong===0)rec(statKey(q.target),true);
  el.classList.remove('hint');el.classList.add(state.game==='feed'?'fly':'right');
  addStar();hopFox();
  if(state.game==='feed')feedFly(el);
  if(state.game==='run'){var ln=document.getElementById('lane');if(ln)ln.classList.add('go')}
  if(state.game==='listen'){
    var wd=document.getElementById('wd'),azw=document.getElementById('azw');
    if(wd)wd.textContent=q.target.en;
    if(azw)azw.textContent=q.target.az;
  }
  sfx('right');confetti(16);
  sayParts(q.explain?q.explain():praiseParts(q.target));
  var my=rid;
  setTimeout(function(){if(my===rid)next()},2300);
}
function next(){
  if(state.screen!=='play')return;
  state.i++;state.wrong=0;state.locked=false;state.cnt=0;
  if(state.i>=state.qs.length){finish();return}
  render();
  var my=rid;
  setTimeout(function(){if(my===rid)sayQ(state.qs[state.i])},350);
}

/* --- memory --- */
function startMemory(topic){
  var pool=topic==='mix'?shuffle(ALL).slice(0,4):pickTargets(TOPICS[topic].items,4);
  state.mem={cards:shuffle(pool.concat(pool)),first:-1,lock:false,found:0,pairs:4};
  state.total=4;state.stars=0;
  go('memory');
}
function flipCard(idx){
  var m=state.mem;
  if(!m||m.lock)return;
  var els=app.querySelectorAll('.mcard'),el=els[idx];
  if(!el||el.classList.contains('flip')||el.classList.contains('done'))return;
  el.classList.add('flip');
  sayItem(m.cards[idx]);
  if(m.first<0){m.first=idx;return}
  var a=m.first,b=idx,my=rid;
  m.first=-1;m.lock=true;
  if(m.cards[a].id===m.cards[b].id){
    setTimeout(function(){
      if(my!==rid)return;
      els[a].classList.add('done');els[b].classList.add('done');
      m.found++;state.stars=m.found;
      addStar();hopFox();sfx('right');confetti(12);
      m.lock=false;
      if(m.found>=m.pairs)setTimeout(function(){if(my===rid)finish()},1200);
    },650);
  }else{
    setTimeout(function(){
      if(my!==rid)return;
      els[a].classList.remove('flip');els[b].classList.remove('flip');
      m.lock=false;
    },1100);
  }
}

/* --- shapes puzzle --- */
function startPuzzle(){
  var holes=shuffle(SHAPES).slice(0,4),tray=shuffle(holes),tries=0;
  while(tries++<30&&tray.some(function(s,i){return s.id===holes[i].id}))tray=shuffle(holes);
  state.pz={holes:holes,tray:tray,found:0,sel:null,wrong:0,bad:{}};
  state.total=holes.length;state.stars=0;state.topic='shapes';
  go('puzzle');
  var my=rid;
  setTimeout(function(){if(my===rid)say('Put each shape in its place!')},400);
}
function selectPiece(el){
  var pz=state.pz;if(!pz)return;
  var all=app.querySelectorAll('.piece');
  for(var i=0;i<all.length;i++)all[i].classList.remove('sel');
  el.classList.add('sel');pz.sel=el.dataset.id;
  var s=byId(el.dataset.id);if(s)sayItem(s);
}
function tryPlace(pieceId,holeEl){
  var pz=state.pz;
  if(!pz||!holeEl||holeEl.classList.contains('filled'))return;
  var pieceEl=app.querySelector('.piece[data-id="'+pieceId+'"]');
  if(!pieceEl||pieceEl.classList.contains('used'))return;
  var shape=byId(pieceId);
  if(holeEl.dataset.shape===pieceId){
    if(!pz.bad[pieceId])rec(pieceId,true);
    pieceEl.classList.add('used');pieceEl.classList.remove('sel');pz.sel=null;
    holeEl.classList.remove('hint');holeEl.classList.add('filled');
    var svg=holeEl.querySelector('.shp');if(svg)svg.style.fill=PIECE_COLORS[pieceId];
    var hl=holeEl.querySelector('.hl');
    if(hl)hl.innerHTML='<b>'+shape.en+'</b><i lang="az">'+shape.az+'</i>';
    pz.found++;pz.wrong=0;state.stars=pz.found;
    addStar();hopFox();sfx('right');confetti(14);
    sayParts(praiseParts(shape));
    var my=rid;
    if(pz.found>=pz.holes.length)setTimeout(function(){if(my===rid)finish()},1800);
  }else{
    if(!pz.bad[pieceId]){pz.bad[pieceId]=1;rec(pieceId,false)}
    pz.wrong++;

  +'<div class="tbox"><canvas id="tg" width="320" height="320"></canvas><canvas id="tcv" width="320" height="320"></canvas></div>'
  +'<div class="prog" aria-hidden="true" style="max-width:340px;margin:12px auto 0"><i id="tprog" style="width:0%"></i></div>'
  +'<div class="row" style="margin-top:18px"><button class="btn" data-action="tclear">↺ Clear</button><button class="btn" data-action="tskip">Skip ➜</button></div>';
}
function initTrace(){
  var cv=document.getElementById('tcv'),gv=document.getElementById('tg');
  if(!cv||!gv||!cv.getContext||!gv.getContext)return;
  var dc=cv.getContext('2d'),gc=gv.getContext('2d');
  if(!dc||!gc)return;
  var S=320,tr=state.tr,ch=tr.items[tr.i],cy=S/2+8;
  var fnt='700 250px Fredoka,"Trebuchet MS",Arial,sans-serif';
  function glyph(ctx){ctx.font=fnt;ctx.textAlign='center';ctx.textBaseline='middle'}
  gc.clearRect(0,0,S,S);glyph(gc);
  gc.fillStyle='rgba(140,115,255,.22)';gc.fillText(ch,S/2,cy);
  gc.setLineDash([10,9]);gc.lineWidth=3;gc.strokeStyle='rgba(43,42,76,.6)';gc.strokeText(ch,S/2,cy);
  var m1=document.createElement('canvas');m1.width=m1.height=S;
  var c1=m1.getContext('2d'),m2=document.createElement('canvas');m2.width=m2.height=S;
  var c2=m2.getContext('2d');
  if(!c1||!c2)return;
  glyph(c1);c1.fillText(ch,S/2,cy);
  glyph(c2);c2.lineWidth=46;c2.lineJoin='round';c2.strokeText(ch,S/2,cy);c2.fillText(ch,S/2,cy);
  var d1,d2;
  try{d1=c1.getImageData(0,0,S,S).data;d2=c2.getImageData(0,0,S,S).data}catch(e){return}
  var pts=[];
  for(var y=0;y<S;y+=6)for(var x=0;x<S;x+=6){var a=(y*S+x)*4+3;if(d1[a]>128)pts.push(a)}
  if(pts.length<20)return;
  dc.lineCap='round';dc.lineJoin='round';dc.lineWidth=30;dc.strokeStyle='#8C73FF';
  var drawing=false,lx=0,ly=0,busy=false,warned=false;
  function pos(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)*S/r.width,(e.clientY-r.top)*S/r.height]}
  cv.addEventListener('pointerdown',function(e){
    if(busy)return;
    e.preventDefault();drawing=true;
    var p=pos(e);lx=p[0];ly=p[1];
    dc.beginPath();dc.moveTo(lx,ly);dc.lineTo(lx+0.1,ly+0.1);dc.stroke();
    try{cv.setPointerCapture(e.pointerId)}catch(err){}
  });
  cv.addEventListener('pointermove',function(e){
    if(!drawing)return;
    var p=pos(e);dc.beginPath();dc.moveTo(lx,ly);dc.lineTo(p[0],p[1]);dc.stroke();lx=p[0];ly=p[1];
  });
  function check(){
    var dd=dc.getImageData(0,0,S,S).data,cov=0,i;
    for(i=0;i<pts.length;i++)if(dd[pts[i]]>0)cov++;
    cov/=pts.length;
    var tot=0,ins=0;
    for(var y2=0;y2<S;y2+=6)for(var x2=0;x2<S;x2+=6){
      var q=(y2*S+x2)*4+3;
      if(dd[q]>0){tot++;if(d2[q]>0)ins++}
    }
    var prec=tot?ins/tot:0;
    var bar=document.getElementById('tprog');
    if(bar)bar.style.width=Math.min(100,Math.round(cov/0.8*Math.min(1,prec/0.7)*100))+'%';
    if(cov>=0.8&&prec>=0.7){busy=true;traceDone()}
    else if(tot>60&&prec<0.5&&!warned){warned=true;toast('Hərfin üstündən get ✏️')}
  }
  function end(){if(!drawing)return;drawing=false;check()}
  cv.addEventListener('pointerup',end);
  cv.addEventListener('pointercancel',end);
}
function traceDone(){
  var my=rid;
  state.stars++;addStar();hopFox();sfx('right');confetti(18);
  say(praise());
  setTimeout(function(){if(my===rid)traceNext()},1500);
}
function traceNext(){
  var tr=state.tr;if(!tr)return;
  tr.i++;
  if(tr.i>=tr.items.length){finish();return}
  render();sayTrace();
}

function catchFrame(my,ts){

  c.last=ts;

  if(sc&&!state.locked){
    c.spawn-=dt;
    if(c.spawn<=0){c.spawn=0.85+Math.random()*0.4;spawnFall(sc,c)}
    for(var i=c.items.length-1;i>=0;i--){
      var f=c.items[i];

      else if(f.y>110){if(f.el.parentNode)f.el.parentNode.removeChild(f.el);c.items.splice(i,1)}
    }
  }
  requestAnimationFrame(function(t2){catchFrame(my,t2)});
}

        return '<button class="btn tile'+(on?' sel':'')+(open?'':' lockd')+'" data-action="dress" data-e="'+it.e+'"><span class="pic">'+(open?it.e:'🔒')+'</span><span class="tw">'+(open?it.en:it.at+' ⭐')+'</span></button>';
      }).join('')+'</div>';
  });
  return html+'<button class="btn wide" data-action="undress">↺ Take off all</button>';
}
function dressToggle(e){
  var it=DRESS.filter(function(x){return x.e===e})[0];
  if(!it)return;
  if(!dressOpen(it)){sfx('wrong');toast(it.at+' ⭐ lazımdır 🔒');return}
  if(outfit[it.slot]===it.e)delete outfit[it.slot];else outfit[it.slot]=it.e;
  store.set('ww_outfit',outfit);
  render();say(it.en,0.8);
}

/* --- daily adventure --- */
function advToday(){
  if(!advData||advData.date!==today()){advData={date:today(),i:0,done:false};store.set('ww_adv',advData)}
  return advData;
}
function advList(){
  var seed=Number(today().replace(/-/g,''))||1;
  function rng(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}
  var pool=ADV_POOL.slice();
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t}
  return pool.slice(0,4);
}
function gameInfo(id){return GAMES.filter(function(g){return g.id===id})[0]}
function advButton(){
  var ad=advToday();
  var sub=ad.done?'✓ Bu gün tamamlandı':(ad.i>0?ad.i+'/4 — davam et':'Hər gün yeni 4 oyun + sürpriz 🎁');
  return '<button class="btn adv" data-action="adventure"><span class="advi" aria-hidden="true">🗺️</span><span class="advt">Today\'s adventure<small lang="az">'+sub+'</small></span></button>';
}
function viewAdventure(){
  var ad=advToday(),list=advList();
  var stops=list.map(function(e,i){
    var cls=i<ad.i||ad.done?' done':(i===ad.i?' now':'');
    var g=gameInfo(e.g);
    return '<div class="stop'+cls+'"><span class="sic">'+(cls===' done'?'✅':GICON[e.g])+'</span><span>'+g.en+'<small lang="az">'+g.az+'</small></span></div>';
  }).join('');
  var gift='<div class="stop'+(ad.done?' done':'')+'"><span class="sic">'+(ad.done?'🎁':'❓')+'</span><span>Surprise!<small lang="az">Günün sürprizi</small></span></div>';
  return topbar()
  +'<div class="title">Today\'s adventure<small lang="az">Günün macərası — 4 oyun və sürpriz</small></div>'
  +'<div class="amap">'+stops+gift+'</div>'
  +(ad.done
    ?'<p class="note" lang="az">Bu günün macərası tamamlandı! Sabah yeni macəra gözləyir. İstəsən, istənilən oyunu sərbəst oynaya bilərsən.</p><button class="btn wide" data-action="home">🏠 Home</button>'
    :'<button class="btn wide primary" data-action="advgo">▶ '+(ad.i>0?'Continue':'Start')+'</button>');
}
function startAdventureStop(){
  var ad=advToday();
  if(ad.done){go('adventure');return}
  var e=advList()[ad.i];
  if(!e){go('adventure');return}
  state.adv={active:true};
  startRound(e.g,e.t||'mix',true);
}
function giveSurprise(){
  var k=dayNum()%3,res=null;
  if(k===0){
    var ms=STICKERS.filter(function(a){return stickers.indexOf(a.id)<0});
    if(ms.length){var st=rnd(ms);stickers.push(st.id);store.set('ww_stickers',stickers);res={e:st.e,txt:'bonus stiker: '+st.az}}
  }else if(k===1){
    var ml=LOOKS.filter(function(l){return l.special&&unlockedLooks.indexOf(l.id)<0});
    if(ml.length){var lk=rnd(ml);unlockedLooks.push(lk.id);store.set('ww_ul',unlockedLooks);res={e:'🖼️',txt:'yeni fon: '+lk.az}}
  }else{
    var md=DRESS.filter(function(x){return !dressOpen(x)});
    if(md.length){var dr=rnd(md);gifts.push(dr.e);store.set('ww_gifts',gifts);res={e:dr.e,txt:'yeni geyim: '+dr.az}}
  }
  if(!res){totalStars+=5;store.set('ww_stars',totalStars);res={e:'⭐',txt:'+5 ulduz'}}
  return res;
}

/* --- short sessions: break time --- */
function viewBreak(){
  var b=state.brk,a=BREAK_ACTS[b.k];
  return '<div class="brk"><h2>Break time!</h2><p class="sub" lang="az">Fasilə vaxtıdır! Bir az hərəkət edək.</p>'
  +'<div class="bigemoji" aria-hidden="true">'+a.e+'</div><div class="word sm">'+a.t+'</div><div class="az" lang="az">'+a.az+'</div>'
  +'<div class="cnt"><span id="bt">'+Math.max(0,b.t)+'</span></div>'
  +'<div class="actions"><button class="btn primary" data-action="brkdone"'+(b.done?'':' disabled')+'>▶ Continue</button>'
  +'<button class="btn" data-action="gate">🔒 Valideyn</button></div></div>';
}
function breakTick(){
  var b=state.brk;if(!b||b.done)return;
  b.t--;
  var el=document.getElementById('bt');if(el)el.textContent=Math.max(0,b.t);
  if(b.t<=0){b.done=true;render();say('Good job! Let us play again!');return}
  if(b.t%9===0){b.k=Math.min(BREAK_ACTS.length-1,b.k+1);render();say(BREAK_ACTS[b.k].t)}
}

/* --- reward --- */
function finish(){
  var g=state.game;
  stats.games[g]=(stats.games[g]||0)+1;day().r++;saveStats();
  if(g==='count'){countLvl=Math.min(countLvl+1,6);store.set('ww_clvl',countLvl)}
  var adventureDone=false;
  if(state.adv&&state.adv.active){
    var ad=advToday();ad.i++;store.set('ww_adv',advData);
    if(ad.i<4){go('adventure');sfx('win');confetti(30);say('Great! Next stop!');return}
    ad.done=true;store.set('ww_adv',advData);state.adv=null;adventureDone=true;
  }
  var missing=STICKERS.filter(function(a){return stickers.indexOf(a.id)<0});
  var preferred=missing.filter(function(a){return a.kind===state.topic});
  var pool=preferred.length?preferred:(missing.length?missing:STICKERS);
  var s=rnd(pool);
  var isNew=missing.length>0;
  if(isNew){stickers.push(s.id);store.set('ww_stickers',stickers)}
  var before=state.startStars||0;
  var news=WORLD.filter(function(w){return w.at>0&&w.at>before&&w.at<=totalStars}).map(function(w){return w.e});
  if(petFor(totalStars).at!==petFor(before).at)news.push(petFor(totalStars).e);
  state.reward={id:s.id,isNew:isNew,all:isNew&&stickers.length>=STICKERS.length,news:news,surprise:adventureDone?giveSurprise():null};
  go('reward');
  sfx('win');confetti(70);
  var who=name?(' '+name):'';
  var msg=isNew?('Hooray'+who+'! You got a new sticker!'):('Hooray'+who+'! Great job!');
  if(adventureDone)msg='Adventure complete'+who+'! You got a surprise! '+msg;
  say(msg);
}

function saveName(v){
  name=String(v||'').trim().slice(0,14);
  store.set('ww_name',name);
}

app.addEventListener('click',function(e){
  /* coloring: tap a region */
  var reg=e.target.closest&&e.target.closest('.reg');
  if(reg&&state.screen==='coloring'){
    reg.style.fill=state.cl.color;

  }
  var b=e.target.closest('[data-action]');

  var a=b.dataset.action;
  if(a==='game'){
    var gm=b.dataset.game,g=GAMES.filter(function(x){return x.id===gm})[0];
    if(gm==='dress')go('dress');
    else if(g&&g.topics){state.game=gm;go('topics')}
    else startRound(gm,gm==='puzzle'?'shapes':'mix');
  }
  else if(a==='topic')startRound(state.game,b.dataset.topic);
  else if(a==='home')go('home');
  else if(a==='learn')go('learn');
  else if(a==='book')go('book');
  else if(a==='look')go('look');
  else if(a==='woods')go('woods');
  else if(a==='adventure')go('adventure');
  else if(a==='advgo')startAdventureStop();
  else if(a==='obj')huntTap(Number(b.dataset.i),b);
  else if(a==='hsay'){var hh=state.hn;if(hh)say('Find the '+hh.objs[hh.targets[hh.k]].en+'!')}
  else if(a==='sword'){
    var stw=state.st;
    if(stw){var w0=b.dataset.w,sc0=stw.story.scenes[stw.i];sayParts([W(w0)],0.75);toast(w0+' = '+((sc0.w&&sc0.w[w0])||''));sfx('pop')}
  }
  else if(a==='ssay')sayScene();
  else if(a==='sopt')storyOpt(Number(b.dataset.i),b);
  else if(a==='snext')storyNext();
  else if(a==='tsay')sayTrace();
  else if(a==='tclear')render();
  else if(a==='tskip')traceNext();
  else if(a==='bpop')bpop(b);
  else if(a==='bsay')sayBalloon();
  else if(a==='csay'){var cc=state.ct;if(cc)say('Catch the '+cc.targets[cc.k].en+'!')}
  else if(a==='dress')dressToggle(b.dataset.e);
  else if(a==='undress'){outfit={};store.set('ww_outfit',outfit);render()}
  else if(a==='brkdone'){sessionSec=0;go('home')}
  else if(a==='sess'){settings.session=Number(b.dataset.v)||0;store.set('ww_session',settings.session);render()}
  else if(a==='again')startRound(state.game,state.topic);
  else if(a==='pick')pick(Number(b.dataset.idx));
  else if(a==='flip')flipCard(Number(b.dataset.idx));
  else if(a==='ask'){var q=state.qs[state.i];if(q)sayQ(q)}
  else if(a==='hello')say(hello());
  else if(a==='askname')say('Hi! What is your name?');
  else if(a==='nameok'){
    var inp=document.getElementById('nameIn');
    saveName(inp?inp.value:'');
    welcomed=true;store.set('ww_welcomed',true);
    go('home');say(hello());
  }
  else if(a==='nameskip'){welcomed=true;store.set('ww_welcomed',true);go('home')}
  else if(a==='tile'){var it=byId(b.dataset.id);if(it)sayItem(it)}
  else if(a==='ltile'){var l=byId(b.dataset.id);if(l)sayParts(['Letter '+l.l+'.',W(l.word)],0.75)}
  else if(a==='slot'){var s=byId(b.dataset.id);if(s)sayItem(s)}
  else if(a==='char'){charIdx=Number(b.dataset.i)||0;store.set('ww_char',charIdx);render()}
  else if(a==='setlook'){
    var lk0=LOOKS.filter(function(l){return l.id===b.dataset.id})[0];
    if(lk0&&lk0.special&&unlockedLooks.indexOf(lk0.id)<0){toast('Günün macərasını tamamlayanda açılır 🎁');return}
    look=b.dataset.id;store.set('ww_look',look);applyLook();render();
  }
  else if(a==='mute'){

    if(muted)stopSpeech();
    var btns=app.querySelectorAll('[data-action="mute"]');
    for(var i=0;i<btns.length;i++)btns[i].textContent=muted?'🔇':'🔊';
  }
  else if(a==='hole'){if(state.pz&&state.pz.sel)tryPlace(state.pz.sel,b)}
  else if(a==='citem'){
    if(b.classList.contains('counted'))return;
    b.classList.add('counted');state.cnt=(state.cnt||0)+1;
    var nn=NUMBERS[state.cnt-1];
    if(nn){sfx('pop');sayItem(nn,0.85)}

  else if(a==='sgo')simonAnswer(true);

  else if(a==='sayagain')saySimon();

  else if(a==='pal'){

    var pb=app.querySelectorAll('.pal button');
    for(var j=0;j<pb.length;j++)pb[j].classList.remove('sel');

  else if(a==='cclear')render();
  else if(a==='cdone')finishColoring();

    var gi=document.getElementById('gateIn'),g2=state.gate;
    if(gi&&parseInt(gi.value,10)===g2.a+g2.b){state.resetArmed=false;go('parent')}

  else if(a==='vdel'){
    var v2=state.vedit;if(!v2)return;
    deleteClip(v2.key,function(){render();setVStatus('Səs yazısı silindi');toast('Silindi')});
  }
  else if(a==='vrec'){
    var v3=state.vedit;if(!v3)return;
    if(recState.active){stopRec();return}
    stopSpeech();
    startRec(v3.key,function(st){
      if(st==='recording'){recButton('⏹ Dayan');setVStatus('Yazılır... "'+v3.label+'" deyin')}
      else if(st==='saved'){render();setVStatus('Yadda saxlanıldı ✓');toast('Yadda saxlanıldı ✓')}
      else{
        recButton('🎙️ Yaz');
        setVStatus({
          denied:'Mikrofona icazə verilmədi. Brauzerdə mikrofon icazəsini açın.',
          unsupported:'Bu brauzer səs yazmağı dəstəkləmir.',
          empty:'Səs eşidilmədi, yenidən cəhd edin.',
          error:'Yadda saxlamaq alınmadı.'
        }[st]||'Xəta baş verdi.');
      }
    });
  }
});

/* drag & drop for the shapes puzzle (tap a piece, then tap a space, also works) */
var drag=null;
app.addEventListener('pointerdown',function(e){
  if(state.screen!=='puzzle'||(e.button!==undefined&&e.button!==0))return;
  var p=e.target.closest&&e.target.closest('.piece');
  if(!p||p.classList.contains('used'))return;
  e.preventDefault();
  drag={el:p,id:p.dataset.id,sx:e.clientX,sy:e.clientY,moved:false,pid:e.pointerId};
  selectPiece(p);
  try{p.setPointerCapture(e.pointerId)}catch(err){}
  p.classList.add('drag');
});
app.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.pid)return;
  var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(Math.abs(dx)+Math.abs(dy)>8)drag.moved=true;
  drag.el.style.transform='translate('+dx+'px,'+dy+'px) scale(1.12)';
});
function endDrag(e,drop){
  if(!drag||e.pointerId!==drag.pid)return;
  var d=drag;drag=null;
  d.el.classList.remove('drag');d.el.style.transform='';
  try{d.el.releasePointerCapture(e.pointerId)}catch(err){}
  if(drop&&d.moved&&document.elementsFromPoint){
    var els=document.elementsFromPoint(e.clientX,e.clientY),hole=null;
    for(var i=0;i<els.length;i++){
      if(els[i].classList&&els[i].classList.contains('hole')){hole=els[i];break}
    }
    if(hole)tryPlace(d.id,hole);
  }
}
app.addEventListener('pointerup',function(e){endDrag(e,true)});
app.addEventListener('pointercancel',function(e){endDrag(e,false)});

/* catch it: the basket follows the finger or mouse */
function catchPointer(e){
  if(state.screen!=='catch')return;
  var sc=document.getElementById('cscene');if(!sc)return;
  var r=sc.getBoundingClientRect();
  if(!r.width)return;
  setBasket((e.clientX-r.left)/r.width*100);
}
app.addEventListener('pointerdown',catchPointer);
app.addEventListener('pointermove',catchPointer);
document.addEventListener('keydown',function(e){
  if(state.screen!=='catch'||!state.ct)return;
  if(e.key==='ArrowLeft'){e.preventDefault();setBasket(state.ct.x-8)}
  else if(e.key==='ArrowRight'){e.preventDefault();setBasket(state.ct.x+8)}
});

/* =====================================================
   play-time tracking and daily limit
   ===================================================== */
setInterval(function(){
  if(document.hidden)return;
  if(state.screen==='break'){breakTick();return}
  if(NO_TIME[state.screen])return;
  var d=day();d.s++;sessionSec++;
  if(d.s%10===0)saveStats();
  var lim=settings.limit;
  if(!lim)return;
  var left=(lim+(d.x||0))*60-d.s;
  if(left===60){toast('1 dəqiqə qaldı ⏰');say('One more minute!')}
  if(left<=0&&!FREE_SCREENS[state.screen])go('sleep');
},1000);
document.addEventListener('visibilitychange',function(){
  if(document.hidden){saveStats();stopSpeech();stopRec()}
});
window.addEventListener('pagehide',saveStats);

render();
if(state.screen==='sleep')say('Time is up! See you tomorrow!');
})();
